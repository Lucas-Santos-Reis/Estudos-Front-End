<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Química +</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>
<header>

</header>    

<div class="question"> 
    <p> Qual é o número de átomos presente na molécula de água? </p>
    <input type="radio" id="optionA" name="options" value="A">
    <label for="optionA"> 1 átomo</label> <br>
    <input type="radio" id="optionB" name="options" value="B">    
    <label for="optionB"> 2 átomos</label> <br>
    <input type="radio" id="optionC" name="options" value="C">
    <label for="optionC"> 3 átomos</label> <br>
    <input type="radio" id="optionD" name="options" value="D">
    <label for="optionD"> 4 átomos</label> <br>
    <input type="radio" id="optionE" name="options" value="E">
    <label for="optionE"> 5 átomos</label> <br>
        <!-- só pode selecionar 1 por name-->
    <button id="sent_answer" type="button"> Enviar Resposta </button>
    <p id="resultado"></p>
    <button id="try_again" type="button">Tente novamente</button>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
